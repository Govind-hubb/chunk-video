services:
  redis:
    image: redis:7-alpine
    container_name: stream_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7-jammy
    container_name: stream_mongodb
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data:
